[project]
name = "longitudinal-health-predictor"
version = "0.1.0"
description = "Causal Representation Learning for Predicting Autoimmune Disease Progression"
readme = "README.md"
authors = [
    { name = "Bongusrihas", email = "srihasbongu1105@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "streamlit>=1.50",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "scipy>=1.11",
    "torch==2.6.0",
    "pytest>=8.0",
    "filelock>=3.13",
    "pymupdf>=1.24,<3",
    "psutil>=5.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false

# PyPI's Windows build is CPU-only. Use the official CUDA wheels on x86-64
# Windows/Linux so both `uv sync` and subsequent `uv run` retain CUDA support.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "(sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
